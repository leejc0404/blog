<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=__W__, height=__H__" />
<!--HFV-->
<script src="vendor/gsap.min.js"></script>
<link rel="stylesheet" href="common.css" />
<style>
  html, body { width: __W__px; height: __H__px; }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; }
  .grain { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.06) 1.5px, transparent 2px); background-size: 9px 9px; }
  .kick { position: absolute; left: 110px; top: 250px; font-weight: 800; font-size: 40px; letter-spacing: .14em; }
  .title { position: absolute; left: 110px; right: 110px; top: 312px; font-weight: 900; letter-spacing: -.03em; line-height: 1.08; }
  .row { position: absolute; left: 110px; right: 110px; height: 150px; border-radius: 26px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; background: rgba(255,255,255,.07); }
  .row .l { font-weight: 700; font-size: 42px; white-space: nowrap; }
  .row .r { text-align: right; }
  .row .v { font-weight: 900; font-size: 60px; white-space: nowrap; letter-spacing: -.02em; }
  .row .s { font-weight: 600; font-size: 32px; white-space: nowrap; }
  .note { position: absolute; left: 110px; right: 110px; font-weight: 700; font-size: 38px; line-height: 1.3; }
  .src { position: absolute; left: 110px; right: 110px; font-weight: 500; font-size: 26px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="__W__" data-height="__H__">
  <div id="stage" class="clip" data-start="0" data-duration="__DUR__" data-track-index="0"></div>
</div>
<script src="common.js"></script>
<script>
/* info_card — KoreaPlug 쇼츠용 정보 카드 B-roll(1080×1920, 기본 6초). shorts_maker 가 위에 자막을 얹으므로
   내용은 y 220~1120 안에만 둔다(제작표준 6장: y 1150~1500 은 자막 자리, 켄번스 확대로 가장자리 10% 잘림 → 좌우 110px 여백).
   값: kicker, title, rows[{label, value, sub?}] ≤4, highlight?, note?, source?, accent?(색)
   파일이 50KB 미만이면 shorts_maker 가 깨진 파일로 보고 건너뛴다 → 배경에 움직이는 빛·입자를 둔다. */
const V = HF.V, W = HF.W, H = HF.H, T = HF.theme(V.theme || "dark");
const acc = HF.color(V.accent, T.accent);
const stage = document.getElementById("stage");
document.body.style.background = `linear-gradient(160deg, #101826 0%, #0b0f17 55%, #1a1220 100%)`;
const tl = gsap.timeline({ paused: true });
const g1 = HF.el("div", "glow", { width: "620px", height: "620px", left: "-120px", top: "180px", background: "#2b6cb0" });
const g2 = HF.el("div", "glow", { width: "560px", height: "560px", left: "620px", top: "760px", background: "#c2410c" });
stage.appendChild(g1); stage.appendChild(g2); stage.appendChild(HF.el("div", "grain"));
tl.to(g1, { x: 160, y: 120, duration: HF.DUR, ease: "sine.inOut" }, 0);
tl.to(g2, { x: -180, y: -90, duration: HF.DUR, ease: "sine.inOut" }, 0);

const kick = HF.el("div", "kick", { color: acc }, HF.esc(V.kicker || "")); stage.appendChild(kick);
const tsz = HF.fit(V.title || "", 84, 860, 900, 52);
const title = HF.el("div", "title", { fontSize: tsz + "px", color: T.fg }, HF.esc(V.title || "")); stage.appendChild(title);
const lines = Math.max(1, Math.ceil(HF.textW(V.title || "", tsz, 900) / 860));
let y = 312 + tsz * 1.08 * lines + 46;
const rows = (V.rows || []).slice(0, 4).map((r, k) => {
  const e = HF.el("div", "row", { top: y + k * 170 + "px" });
  if (V.highlight === k) e.style.boxShadow = `inset 0 0 0 5px ${acc}`;
  e.innerHTML = `<div class="l" style="color:${T.sub};font-size:${HF.fit(r.label, 42, 380, 700, 30)}px">${HF.esc(r.label)}</div>` +
    `<div class="r"><div class="v" style="color:${V.highlight === k ? acc : T.fg};font-size:${HF.fit(r.value, 60, 420, 900, 36)}px">${HF.esc(r.value)}</div>` +
    (r.sub ? `<div class="s" style="color:${T.sub}">${HF.esc(r.sub)}</div>` : "") + `</div>`;
  stage.appendChild(e); return e;
});
y += rows.length * 170 + 10;
let note = null;
if (V.note && y < 1060) { note = HF.el("div", "note", { top: y + "px", color: acc }, HF.esc(V.note)); stage.appendChild(note); }
if (V.source) stage.appendChild(HF.el("div", "src", { top: "1085px", color: T.sub }, HF.esc(V.source)));

// 쇼츠 컷은 1.4~2.0초라 0.9초 안에 다 보이게 한다(그 뒤는 빛·강조만 움직인다)
tl.from(kick, { opacity: 0, x: -30, duration: 0.25, ease: "power2.out" }, 0.0);
tl.from(title, { opacity: 0, y: 40, duration: 0.3, ease: "power3.out" }, 0.05);
rows.forEach((r, k) => tl.from(r, { opacity: 0, x: 80, duration: 0.3, ease: "power3.out" }, 0.2 + k * 0.12));
if (V.highlight != null && rows[V.highlight]) {
  const t = 0.9;
  tl.fromTo(rows[V.highlight], { scale: 1 }, { scale: 1.04, duration: 0.18, ease: "power2.out", immediateRender: false }, t)
    .to(rows[V.highlight], { scale: 1, duration: 0.25, ease: "power2.inOut" }, t + 0.18);
}
if (note) tl.from(note, { opacity: 0, y: 20, duration: 0.3 }, 0.75);
tl.set({}, {}, HF.DUR);
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
tl.seek(0);
</script>
</body>
</html>
